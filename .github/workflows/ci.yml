name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A superseded pull-request run is wasted compute and cancelling it is free. A push to main
# is a release (README, "Deployment") and cancelling one is not: workflow-level cancellation
# takes the jobs with it, so `cancel-in-progress: true` here could stop a run between the
# production migration and the code that reads it, or between the two Workers — a
# half-deployed production with a green tick on the run that replaced it. Pushes to main
# therefore queue behind each other rather than replacing each other, and the deploy jobs
# add a group of their own so two runs cannot deploy at once.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Third-party actions are pinned by commit SHA, with the version in a comment.
#
# A tag is a pointer somebody else can move, and `deploy-production` below hands
# `CLOUDFLARE_API_TOKEN` to whatever the pointer names on the day it runs. Pinning is the
# difference between trusting a release and trusting an account. `dependabot.yml` keeps them
# current — it reads the trailing comment and moves the pin and the version together — so a
# pin does not quietly become a version nobody has looked at since.

env:
  # Not a credential — an identifier. Kept as a repository variable (PLAN.md §1.4).
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  # Job name is `ci` because the branch ruleset requires this exact check.
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # `pnpm/action-setup` installs pnpm by running an `npm install` into `~/setup-pnpm`, and
      # that install is the single most expensive step in this workflow: measured at 109s,
      # 316s and 254s across three consecutive runs of the same commit range. The variance is
      # the point — it is registry latency, not work — and five jobs pay it on every push.
      #
      # `standalone` skips one layer of it. The cache skips the rest on a hit: the directory
      # is a pinned version of one tool, so the only thing that invalidates it is that pin
      # moving. A miss behaves exactly as before.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/setup-pnpm
          key: setup-pnpm-${{ runner.os }}-${{ hashFiles('package.json') }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          standalone: true
        # The action installs pnpm with `npm install`, and npm calls the advisory endpoint on
        # every install. npmjs is retiring that endpoint — its own notice says so, in this
        # step's log — and it now answers in minutes rather than milliseconds. Same workflow,
        # same commit range, two hours apart: 5s, then 423s. `audit` is a security scan of a
        # package manager we are installing in order to install our own dependencies, whose
        # lockfile is the thing that actually needs auditing; `fund` is a message.
        env:
          NPM_CONFIG_AUDIT: "false"
          NPM_CONFIG_FUND: "false"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: typecheck
        run: pnpm typecheck
      - name: lint
        run: pnpm lint
      - name: boundaries
        run: pnpm boundaries
      - name: skills
        run: pnpm skills
      # ADR 0013 — the written documentation pages against the contract they describe. Here
      # rather than in the `docs` job because what breaks it is a code change: a new scope, a
      # new error type or a new MCP tool falsifies a page nothing else makes anybody open.
      - name: docs drift
        run: pnpm docs:drift
      # §53 — the published description of the API, checked against the schemas it is
      # generated from. `pnpm check` has run this since it existed and this workflow lists
      # its steps by hand, so a stale docs/openapi.json passed CI for as long as both have
      # been true.
      - name: openapi
        run: pnpm openapi:check
      - name: schema
        run: pnpm schema
      - name: test
        run: pnpm test
      - name: build
        run: pnpm build

  # SPEC §64.3 — GitHub Actions is the single orchestrator. Migrations run here, before
  # the code that depends on them, which is the ordering the Cloudflare git integration
  # cannot guarantee and the reason it stays disabled for production.
  deploy-staging:
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: staging
    # One release at a time. These steps are separately committed — migrations, then the edge
    # Worker, then the web Worker — and nothing between them can be rolled back, so two runs
    # interleaving is a deployment nobody chose.
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # `pnpm/action-setup` installs pnpm by running an `npm install` into `~/setup-pnpm`, and
      # that install is the single most expensive step in this workflow: measured at 109s,
      # 316s and 254s across three consecutive runs of the same commit range. The variance is
      # the point — it is registry latency, not work — and five jobs pay it on every push.
      #
      # `standalone` skips one layer of it. The cache skips the rest on a hit: the directory
      # is a pinned version of one tool, so the only thing that invalidates it is that pin
      # moving. A miss behaves exactly as before.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/setup-pnpm
          key: setup-pnpm-${{ runner.os }}-${{ hashFiles('package.json') }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          standalone: true
        # The action installs pnpm with `npm install`, and npm calls the advisory endpoint on
        # every install. npmjs is retiring that endpoint — its own notice says so, in this
        # step's log — and it now answers in minutes rather than milliseconds. Same workflow,
        # same commit range, two hours apart: 5s, then 423s. `audit` is a security scan of a
        # package manager we are installing in order to install our own dependencies, whose
        # lockfile is the thing that actually needs auditing; `fund` is a message.
        env:
          NPM_CONFIG_AUDIT: "false"
          NPM_CONFIG_FUND: "false"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: apply migrations
        run: pnpm --filter @orator/edge exec wrangler d1 migrations apply DB --env staging --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: deploy edge
        run: pnpm --filter @orator/edge deploy:staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: deploy web
        run: pnpm --filter @orator/web deploy:staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # Both Workers, because `/health` can only see one of them (§62, §63).
      - name: secrets
        run: node scripts/check-secrets.mjs --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: smoke
        run: node scripts/smoke.mjs https://api-staging.orator.space

      # The checkpoints are the only tests that exercise a real deployment, and until now
      # nothing ran them but somebody remembering to. `e2e-read.mjs` was broken for a whole
      # phase because Phase 5 made token issuance idempotent and the script was never run
      # again. Here a checkpoint that rots fails the build that rotted it, and production
      # does not deploy behind it.
      - name: checkpoint — publishing (Phase 3)
        run: node scripts/e2e-publish.mjs https://api-staging.orator.space
      - name: checkpoint — reading (Phase 4)
        run: node scripts/e2e-read.mjs https://staging.orator.space https://api-staging.orator.space
      - name: checkpoint — the REST surface (Phase 5)
        run: node scripts/e2e-phase5.mjs https://api-staging.orator.space https://staging.orator.space
      - name: checkpoint — MCP (Phase 6)
        run: node scripts/e2e-phase6.mjs https://mcp-staging.orator.space https://api-staging.orator.space
      # The §84 chain, run by three agents from outside. This is the one that answers
      # whether the thing is a network rather than a CMS with an API, so it must run on
      # every deployment: a scenario demonstrated once and never again decays into a story.
      - name: checkpoint — the vertical slice (Phase 7)
        run: node scripts/e2e-phase7.mjs https://api-staging.orator.space https://staging.orator.space https://mcp-staging.orator.space
      # The first page on this site that writes, and the first that renders a secret. It
      # runs here because both of those are things a regression makes silently worse: a
      # cacheable account page is not a stale page, it is somebody else's token.
      - name: checkpoint — the account page (Phase 9)
        run: node scripts/e2e-phase9.mjs https://api-staging.orator.space https://staging.orator.space

  deploy-production:
    needs: deploy-staging
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # As above, and for the larger stake: a production deploy that begins finishes.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    # Add required reviewers to this environment in GitHub to reinstate a manual gate
    # (SPEC §64.1). Left ungated it still cannot run unless staging deployed cleanly.
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # `pnpm/action-setup` installs pnpm by running an `npm install` into `~/setup-pnpm`, and
      # that install is the single most expensive step in this workflow: measured at 109s,
      # 316s and 254s across three consecutive runs of the same commit range. The variance is
      # the point — it is registry latency, not work — and five jobs pay it on every push.
      #
      # `standalone` skips one layer of it. The cache skips the rest on a hit: the directory
      # is a pinned version of one tool, so the only thing that invalidates it is that pin
      # moving. A miss behaves exactly as before.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/setup-pnpm
          key: setup-pnpm-${{ runner.os }}-${{ hashFiles('package.json') }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          standalone: true
        # The action installs pnpm with `npm install`, and npm calls the advisory endpoint on
        # every install. npmjs is retiring that endpoint — its own notice says so, in this
        # step's log — and it now answers in minutes rather than milliseconds. Same workflow,
        # same commit range, two hours apart: 5s, then 423s. `audit` is a security scan of a
        # package manager we are installing in order to install our own dependencies, whose
        # lockfile is the thing that actually needs auditing; `fund` is a message.
        env:
          NPM_CONFIG_AUDIT: "false"
          NPM_CONFIG_FUND: "false"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: apply migrations
        run: pnpm --filter @orator/edge exec wrangler d1 migrations apply DB --env production --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: deploy edge
        run: pnpm --filter @orator/edge deploy:production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: deploy web
        run: pnpm --filter @orator/web deploy:production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: secrets
        run: node scripts/check-secrets.mjs --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: smoke
        run: node scripts/smoke.mjs https://api.orator.space

  # ADR 0013 — the documentation site.
  #
  # Beside `ci` rather than inside it. The `ci` job already runs for ten minutes and every
  # minute of it is in the way of a code change; a prose change has no business adding to
  # that, and an application change has no business waiting on Pagefind. `pnpm build` and
  # `pnpm dev` exclude @orator/docs for the same reason, which is why the build has to be
  # named here rather than inherited.
  #
  # This is also where the checks live that a staging deployment would otherwise have caught:
  # `astro check`, because tsc does not read .astro, and starlight-links-validator, which
  # fails the build on a broken internal link. There is no docs-staging to notice either one
  # later.
  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # `pnpm/action-setup` installs pnpm by running an `npm install` into `~/setup-pnpm`, and
      # that install is the single most expensive step in this workflow: measured at 109s,
      # 316s and 254s across three consecutive runs of the same commit range. The variance is
      # the point — it is registry latency, not work — and five jobs pay it on every push.
      #
      # `standalone` skips one layer of it. The cache skips the rest on a hit: the directory
      # is a pinned version of one tool, so the only thing that invalidates it is that pin
      # moving. A miss behaves exactly as before.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/setup-pnpm
          key: setup-pnpm-${{ runner.os }}-${{ hashFiles('package.json') }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          standalone: true
        # The action installs pnpm with `npm install`, and npm calls the advisory endpoint on
        # every install. npmjs is retiring that endpoint — its own notice says so, in this
        # step's log — and it now answers in minutes rather than milliseconds. Same workflow,
        # same commit range, two hours apart: 5s, then 423s. `audit` is a security scan of a
        # package manager we are installing in order to install our own dependencies, whose
        # lockfile is the thing that actually needs auditing; `fund` is a message.
        env:
          NPM_CONFIG_AUDIT: "false"
          NPM_CONFIG_FUND: "false"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: check and build
        run: pnpm docs:check

  # `needs: docs`, and deliberately neither `ci` nor `deploy-production`.
  #
  # Hanging this off production would mean a failing Phase 7 checkpoint blocks the publication
  # of a corrected typo. Putting it before production would mean a broken documentation build
  # delays a release of the code. The two have no relationship, so they get no edge.
  #
  # One environment, and it is production: there is no docs-staging (ADR 0013). `wrangler
  # deploy` with no --env is correct here and nowhere else in this file — apps/docs has a
  # single top-level configuration block with no `env` sections to select between.
  deploy-docs:
    needs: docs
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # `pnpm/action-setup` installs pnpm by running an `npm install` into `~/setup-pnpm`, and
      # that install is the single most expensive step in this workflow: measured at 109s,
      # 316s and 254s across three consecutive runs of the same commit range. The variance is
      # the point — it is registry latency, not work — and five jobs pay it on every push.
      #
      # `standalone` skips one layer of it. The cache skips the rest on a hit: the directory
      # is a pinned version of one tool, so the only thing that invalidates it is that pin
      # moving. A miss behaves exactly as before.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/setup-pnpm
          key: setup-pnpm-${{ runner.os }}-${{ hashFiles('package.json') }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          standalone: true
        # The action installs pnpm with `npm install`, and npm calls the advisory endpoint on
        # every install. npmjs is retiring that endpoint — its own notice says so, in this
        # step's log — and it now answers in minutes rather than milliseconds. Same workflow,
        # same commit range, two hours apart: 5s, then 423s. `audit` is a security scan of a
        # package manager we are installing in order to install our own dependencies, whose
        # lockfile is the thing that actually needs auditing; `fund` is a message.
        env:
          NPM_CONFIG_AUDIT: "false"
          NPM_CONFIG_FUND: "false"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: build
        run: pnpm --filter @orator/docs build
      # wrangler invoked directly from the app directory, not through `pnpm exec`. The
      # package-manager wrapper is the shape that swallowed `--env` and overwrote production
      # on 2026-08-29, and .claude/hooks/guard-wrangler.sh blocks it repository-wide — CI
      # should not be the one place that uses it. The binary is a root devDependency.
      - name: deploy
        working-directory: apps/docs
        run: ../../node_modules/.bin/wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
